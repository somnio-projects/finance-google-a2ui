name: finance_app
description: The A2UI finance client — binds backend-shaped view payloads to catalog components.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
  # Verified, not guessed: Flutter 3.47.5 vendors Dart 3.13.4. See frontend/CLAUDE.md.
  flutter: ^3.47.0

resolution: workspace

dependencies:
  bloc: ^9.2.1
  # The Flutter template dependency. Present because the framework and
  # go_router reference CupertinoIcons on code paths this web-first app does
  # not take; without it every release build warns about a missing font.
  cupertino_icons: ^1.0.8
  equatable: ^3.0.0
  finance_api_client: ^0.1.0
  # Who is signed in and whether they were invited (spec frontend/0008).
  finance_auth: ^0.1.0
  # The geometry half of every chart: scales and layouts, pure Dart.
  finance_charts: ^0.1.0
  finance_core: ^0.1.0
  finance_views_repository: ^0.1.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^18.0.1
  # Imported by bootstrap.dart alone, to construct the one http.Client the
  # composition root owns. No other file in app/ may import it.
  http: ^1.6.0
  # The browser's own APIs, typed. Imported by app/lib/speech/speech_web.dart
  # and nowhere else — `speech_rules_test.dart` fails on a second importer
  # (spec frontend/0023 AC-10). Already in the lock as a transitive of the
  # Flutter web tooling; declared here because this app now calls it.
  web: ^1.1.1

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
