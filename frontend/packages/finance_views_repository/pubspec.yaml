name: finance_views_repository
description: Repository layer — turns a view request into a rendered-view envelope. Composes the API client; holds no Flutter.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  equatable: ^3.0.0
  finance_api_client: ^0.1.0
  finance_core: ^0.1.0

dev_dependencies:
  coverage: ^1.15.0
  # Test-only: the repository suite drives the transport with MockClient so it
  # never opens a socket. Nothing under lib/ may import http (the layering test
  # checks that the data layer stays the only HTTP speaker).
  http: ^1.6.0
  test: ^1.27.0
  very_good_analysis: ^11.0.0
