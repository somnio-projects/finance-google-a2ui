# Local quality gate — the cheap half of the ship gate.
#
# Everything a laptop can prove runs here, before the commit, so CI minutes are
# spent only on what a laptop cannot: a real PostgreSQL, the container image and
# scans over the full history (.claude/rules/ci-conventions.md).
#
#   pre-commit install && pre-commit install --hook-type pre-push
#   pre-commit run --all-files
#
# Hook ids are stable; the `backend-*` ones shell out to the same commands as
# `make gate`, so local and CI can never disagree.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: false

repos:
  # ---------------------------------------------------------------- hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      # The Terraform provider cache once reached the 100 MB GitHub limit.
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]

  # ---------------------------------------------------------------- secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------- python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ---------------------------------------------------------------- prose
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        # Reads .codespellrc at the repository root — the same word list
        # `repo.spelling` uses. It used to read backend/pyproject.toml, whose
        # word list knows nothing about the Flutter or docs vocabulary, so this
        # hook flagged `bloc` on every Flutter file it touched. Two configs for
        # one check is the drift .claude/rules/ci-conventions.md §5 is about.
        #
        # pre-commit hands the hook an explicit list of changed files, so the
        # directory walk that made `repo.spelling` blind to `.claude/` never
        # applies here — this half was always correct about its scope.
        additional_dependencies: [tomli]
        exclude: |
          (?x)^(
            \.claude/skills/|
            \.agents/|
            \.claude/rules/(python|flutter)/|
            .*\.lock
          )
  # ---------------------------------------------------------------- yaml & actions
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # ---------------------------------------------------------------- shell
  # The shellcheck-precommit hook used to sit here and lint the changed shell
  # files. It is now `repo.shell-lint`, in the local block below, so that the
  # hook, `repo-ci.yaml` and `ship-gate.json` all run one command string over
  # one file list. Two configurations for one check is the same drift as two
  # command strings (.claude/rules/ci-conventions.md §5) — and it had already
  # produced one: the hook's default severity would have failed both container
  # entry points, while the only shellcheck in CI never opened either.

  # ---------------------------------------------------------------- terraform
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt

  # ------------------------------------------------- backend gate (local tools)
  - repo: local
    hooks:
      # ----------------------------------------- repository-wide (local tools)
      # Runs on any shell change anywhere, because its subject is "every script
      # this repository ships", not one stack's. Command string copied from
      # .claude/ship-gate.json (`repo.shell-lint`) and repo-ci.yaml, not
      # paraphrased.
      - id: repo-shell-lint
        name: Lint every tracked shell script (shellcheck)
        entry: bash scripts/check_shell.sh
        language: system
        files: \.sh$
        pass_filenames: false

      # Runs when either half of a §5 pair moves — the gate file or any
      # workflow — because the property it guards spans the two, the same
      # trigger shape as `infra-dev-environment` above.
      - id: repo-gate-pairs
        name: Prove every gate command appears verbatim in its workflow (check_gate_pairs.sh)
        entry: bash scripts/check_gate_pairs.sh
        language: system
        files: ^(\.claude/ship-gate\.json|\.github/workflows/)
        pass_filenames: false

      # Runs when the check, its suite, or the rule that defines the manual-run
      # template moves. It proves the check REJECTS — a stale build, a foreign
      # one, an unknown sha and a transcript with no identity at all (GGU-93).
      - id: repo-manual-run
        name: Prove the manual-run check rejects a stale or foreign build (test_check_manual_run.sh)
        entry: bash scripts/tests/test_check_manual_run.sh
        language: system
        files: ^(scripts/check_manual_run\.sh|scripts/tests/test_check_manual_run\.sh|\.claude/rules/backend/sdd\.md)$
        pass_filenames: false

      - id: backend-typecheck
        name: Type-check the backend in strict mode (basedpyright)
        entry: bash -c 'cd backend && uv run basedpyright'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: backend-file-budget
        name: Enforce the 150-line file budget (check_file_budget.py)
        entry: bash -c 'cd backend && uv run python scripts/check_file_budget.py'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      # docs/catalog/CONTRACT.md and docs/catalog/view-catalog.snapshot.json are
      # both generated from the projection registry, in one pass, so a projection
      # that moves and an artefact that did not is caught here, on the laptop,
      # rather than after the design work is done (GGU-41, GGU-53).
      - id: backend-catalog-contract
        name: Verify the generated catalog artefacts are current (generate_catalog_contract.py)
        entry: bash -c 'cd backend && uv run python scripts/generate_catalog_contract.py --check'
        language: system
        files: ^(backend/src/app/presentation/|backend/scripts/generate_catalog_contract\.py|docs/catalog/)
        pass_filenames: false

      - id: backend-quality
        name: Detect code smells (xenon, vulture, interrogate, deptry, pylint)
        entry: bash -c 'cd backend && make quality'
        language: system
        files: ^backend/(src|tests|scripts|pyproject\.toml)
        pass_filenames: false

      # The delivery scripts are shell, so they get shell tests: the deploy
      # runs against a stub gcloud, including the rollback path (spec 0007 AC-4).
      - id: delivery-deploy-script
        name: Prove the deploy verifies and rolls back (test_deploy_cloud_run.sh)
        entry: bash infra/scripts/tests/test_deploy_cloud_run.sh
        language: system
        files: ^infra/scripts/
        pass_filenames: false

      - id: delivery-credential-model
        name: Prove the pipeline holds no long-lived key (test_wif_conditions.sh)
        entry: bash infra/scripts/tests/test_wif_conditions.sh
        language: system
        files: ^infra/
        pass_filenames: false

      # Reads the Terraform AND both backend workflows, so it must run when
      # either side moves — the property it guards spans the two.
      - id: infra-dev-environment
        name: Prove dev stays cheap and releases behind a green gate (test_dev_environment.sh)
        entry: bash infra/scripts/tests/test_dev_environment.sh
        language: system
        files: ^(infra/|\.github/workflows/backend-c[di]\.yaml$)
        pass_filenames: false

      # The rules index in CLAUDE.md sits inside the block /harness-init
      # regenerates, so a row can disappear without anyone editing it by hand —
      # and a rule with no row silently stops loading (GGU-86). Runs when either
      # side of the comparison moves: the table, or the rules directory.
      - id: harness-rules-index
        name: Prove every rule file is listed and every row exists (test_rules_index.sh)
        entry: bash infra/scripts/tests/test_rules_index.sh
        language: system
        files: ^(\.claude/rules/|CLAUDE\.md$)
      # The rate limiter counts per process, so the documented per-principal
      # limit is only true at one instance (GGU-83). The instance count lives in
      # Terraform and the limit in Markdown and Python, and nothing else reads
      # all three — so this runs when any of them moves.
      - id: infra-rate-limit-ceiling
        name: Prove the documented rate limit matches the instance count (test_rate_limit_ceiling.sh)
        entry: bash infra/scripts/tests/test_rate_limit_ceiling.sh
        language: system
        files: ^(infra/|backend/docs/SECURITY\.md$|backend/src/app/core/config\.py$|backend/env\.example$|docs/diagrams/08-infrastructure\.md$)
        pass_filenames: false

      # Fast enough for every commit; the DB-backed suite runs on push.
      - id: backend-unit-tests
        name: Run the unit suite (pytest -m unit)
        entry: bash -c 'cd backend && uv run pytest -m unit --no-cov -q'
        language: system
        files: ^backend/(src|tests)/.*\.py$
        pass_filenames: false

      - id: backend-full-gate
        name: Run the full ship gate before pushing (make gate)
        entry: bash -c 'cd backend && make gate'
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [pre-push]

      # ------------------------------------------------ frontend gate (local tools)
      # The cheap half of `cd frontend && make gate`. Command strings are
      # copied from frontend/Makefile and .claude/ship-gate.json, not
      # paraphrased (.claude/rules/ci-conventions.md 5). The suites and the
      # coverage threshold run in CI and in the pre-push gate below.
      # First, because every hook below it reads the tree through `dart`. A
      # Dart below the SDK floor declared in frontend/pubspec.yaml formats
      # tracked files differently and exits 65, which reads as a red branch and
      # is a red toolchain (GGU-94). This one says which.
      - id: frontend-toolchain
        name: Prove the pinned Flutter SDK is on PATH (check_toolchain.sh)
        entry: bash -c 'cd frontend && bash tool/check_toolchain.sh'
        language: system
        files: ^frontend/
        pass_filenames: false

      # Needs no SDK at all — it stubs one — so it runs when the preflight, its
      # suite or the pin moves, on any machine.
      - id: frontend-toolchain-test
        name: Prove the preflight rejects a wrong or missing SDK (test_check_toolchain.sh)
        entry: bash -c 'cd frontend && bash tool/tests/test_check_toolchain.sh'
        language: system
        files: ^frontend/(tool/check_toolchain\.sh|tool/tests/test_check_toolchain\.sh|\.fvmrc)$
        pass_filenames: false

      - id: frontend-format
        name: Verify Dart formatting is canonical (dart format)
        entry: bash -c 'cd frontend && dart format --output=none --set-exit-if-changed .'
        language: system
        files: ^frontend/.*\.dart$
        pass_filenames: false

      - id: frontend-analyze
        name: Analyse with infos and warnings fatal (dart analyze)
        entry: bash -c 'cd frontend && dart analyze --fatal-infos --fatal-warnings'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-budget
        name: Enforce the 150-line file budget (check_file_budget.dart)
        entry: bash -c 'cd frontend && dart run tool/check_file_budget.dart'
        language: system
        files: ^frontend/.*\.dart$
        pass_filenames: false

      - id: frontend-manifest
        name: Verify the generated component manifest is current (generate_component_manifest.dart)
        entry: bash -c 'cd frontend && dart run tool/generate_component_manifest.dart --check'
        language: system
        files: ^frontend/app/lib/components/
        pass_filenames: false

      - id: frontend-full-gate
        name: Run the full frontend ship gate before pushing (make gate)
        entry: bash -c 'cd frontend && make gate'
        language: system
        files: ^frontend/

      # ------------------------------------------- client gate (local tools)
      # These need the Flutter SDK pinned in client_flutter/.fvmrc on PATH and
      # a resolved workspace: run `cd client_flutter && flutter pub get` once
      # per clone. The release web build is the only slow one, so it waits for
      # push, exactly like the backend's DB-backed suite.
      # Source directories only: `dart format` has no exclude flag, and
      # app/build/ holds plugin sources unpacked by `flutter pub get`.
      - id: client-format
        name: Verify Dart formatting is canonical (dart format)
        entry: bash -c 'cd client_flutter && dart format --output=none --set-exit-if-changed app/lib app/test e2e_test'
        language: system
        files: ^client_flutter/.*\.dart$
        pass_filenames: false

      - id: client-analyze
        name: Analyse the client in strict mode (dart analyze)
        entry: bash -c 'cd client_flutter && dart analyze --fatal-infos --fatal-warnings app/lib app/test e2e_test'
        language: system
        files: ^client_flutter/.*\.(dart|yaml)$
        pass_filenames: false

      - id: client-tokens
        name: Assert no colour literals outside the theme layer (check_tokens.sh)
        entry: bash client_flutter/tool/check_tokens.sh
        language: system
        files: ^client_flutter/app/lib/
        pass_filenames: false

      - id: client-config
        name: Assert no endpoint URLs outside the config layer (check_config.sh)
        entry: bash client_flutter/tool/check_config.sh
        language: system
        files: ^client_flutter/app/lib/
        pass_filenames: false

      - id: client-tests
        name: Run the client suite (flutter test)
        entry: bash -c 'cd client_flutter/app && flutter test'
        language: system
        files: ^client_flutter/app/(lib|test)/.*\.dart$
        pass_filenames: false

      - id: client-web-build
        name: Compile the release web bundle before pushing (flutter build web)
        entry: bash -c 'cd client_flutter/app && flutter build web --release'
        language: system
        files: ^client_flutter/
        pass_filenames: false
        stages: [pre-push]
