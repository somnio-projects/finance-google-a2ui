# Automated dependency updates (SOC 2 CC8.1 / ISO 27001 A.8.8 — vulnerability management).
# Security releases open PRs that still have to pass the backend ship gate.
#
# `target-branch: develop` on every ecosystem, because without it Dependabot
# opens against the repository's default branch — `main`. Five such PRs sat
# open for weeks doing exactly that: based on a `main` thirty commits stale,
# proposing edits to workflows that no longer looked anything like that. They
# were unmergeable by construction, and nothing said so.
#
# `develop` is the integration branch and the only branch a PR may target
# (root CLAUDE.md); `main` receives it through a release PR. A bot is not an
# exception to that.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      backend-runtime:
        dependency-type: "production"
      backend-dev:
        dependency-type: "development"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build(deps)"

  # The Dart graph had no dependency telemetry of any kind: not here, not in a
  # gate, not in the weekly scan. The backend's zero-outdated-dependencies
  # record is direct evidence that this mechanism works, and it was pointed at
  # one of the stacks this repository ships. There were two `pub` entries here
  # while two Flutter apps existed; `client_flutter/` was retired on
  # 2026-09-22 (spec `repo/0002`) and its entry went with it.
  #
  # `directory:` is the pub WORKSPACE root, which is where the single
  # `pubspec.lock` lives. The member packages (`app/`, `packages/*`) resolve
  # through it — a per-member entry would find a manifest with no lock beside
  # it.
  - package-ecosystem: "pub"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      frontend-dart:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
