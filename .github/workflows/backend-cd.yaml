# Backend continuous delivery (spec 0007, GGU-48).
#
# Naming contract (.claude/rules/ci-conventions.md):
#   job name  = "<Area> · <what it proves>"
#   step name = "<Verb> <object> (<tool>)"
#
# Delivery is MANUAL. There is no `push:` trigger: merging to `develop` builds
# and deploys nothing. Someone presses "Run workflow" in the Actions tab and
# picks the branch, and the branch decides the environment —
#
#   run from `develop` -> dev
#   run from `main`    -> production, behind the `production` Environment's
#                         required reviewer, exactly as before
#
# Why: a POC does not merge and deploy in the same motion, and paying for a
# build plus a deploy on every merge is the largest avoidable line in the CI
# bill. PR checks are untouched — `backend-ci` still runs on every pull request
# that touches `backend/**`, which is where a regression should be caught.
#
# The button only appears once this file exists on the repository's DEFAULT
# branch. GitHub reads `workflow_dispatch` from the default branch only, so a
# workflow that lives solely on `develop` is invisible in the UI and
# `gh workflow run` answers "not found on the default branch". Releasing
# `develop` into `main` is what makes the button real.
#
# Nothing is built or deployed until the full backend gate has passed ON THIS
# COMMIT. `backend-ci.yaml` is called as the `ci` job below and `publish` and
# `deploy` declare `needs: [ci]`, so a red quality, test, security or image job
# leaves them skipped and the run red. This is a real dependency inside one
# run, not a `workflow_run` trigger that fires on completion and then has to
# remember to inspect `conclusion` — the ordering is enforced by Actions
# itself, and `infra/scripts/tests/test_dev_environment.sh` fails the build if
# the `needs` edge is ever removed.
#
# Credentials: Workload Identity Federation only. There is no service-account
# key in this repository's secrets, and `infra/scripts/tests/test_wif_conditions.sh`
# fails the build if one is ever added. Each environment has its own pool,
# provider and deployer identity, so the repository variables are suffixed per
# environment and the `settings` job resolves them once.
#
# Before the first run, GGU-29 must have applied Terraform; then set the
# repository variables listed in spec 0007 §9 from the Terraform outputs.
name: backend-cd

on:
  # Manual only, on purpose — see the header. Nothing here reacts to a push.
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Revision to send 100% of traffic to (leave empty to deploy HEAD)"
        required: false
        type: string

permissions:
  contents: read

# Deploys are serialised per branch and never cancelled halfway: a cancelled
# traffic shift is exactly the state this pipeline exists to avoid, so this
# deliberately departs from the cancel-in-progress rule in ci-conventions.md §3.
concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gate, on this commit, before anything is built or deployed. Calling the
  # workflow (rather than duplicating its jobs) keeps one definition of the gate
  # — `.claude/ship-gate.json` stays the single Definition of Done.
  ci:
    name: "Gate · the full backend ship gate on the commit being released"
    uses: ./.github/workflows/backend-ci.yaml
    permissions:
      contents: read

  settings:
    name: "Target · resolve the environment this ref releases to"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      project: ${{ steps.resolve.outputs.project }}
      provider: ${{ steps.resolve.outputs.provider }}
      deployer: ${{ steps.resolve.outputs.deployer }}
      public_url: ${{ steps.resolve.outputs.public_url }}
      region: ${{ vars.GCP_REGION }}
      repository: ${{ steps.resolve.outputs.repository }}
      service: ${{ steps.resolve.outputs.service }}
    steps:
      # `develop` releases dev, `main` releases production. There is no staging
      # environment: the proof of concept replaced it
      # (specs/infra/0001-dev-environment.md). Each environment has its own
      # Workload Identity pool, deployer identity and public URL, so every
      # variable below is suffixed with the environment — and when one is
      # missing the error names it exactly as a human must create it, because
      # "GCP_PROJECT_ID is not set" sends people looking for a variable that
      # does not exist under that name.
      - name: Resolve the per-environment variables for this ref (bash)
        id: resolve
        env:
          IS_PRODUCTION: ${{ github.ref_name == 'main' }}
          PROJECT_DEV: ${{ vars.GCP_PROJECT_ID_DEV }}
          PROJECT_PRODUCTION: ${{ vars.GCP_PROJECT_ID_PRODUCTION }}
          PROVIDER_DEV: ${{ vars.GCP_WIF_PROVIDER_DEV }}
          PROVIDER_PRODUCTION: ${{ vars.GCP_WIF_PROVIDER_PRODUCTION }}
          DEPLOYER_DEV: ${{ vars.GCP_DEPLOYER_SA_DEV }}
          DEPLOYER_PRODUCTION: ${{ vars.GCP_DEPLOYER_SA_PRODUCTION }}
          PUBLIC_URL_DEV: ${{ vars.PUBLIC_URL_DEV }}
          PUBLIC_URL_PRODUCTION: ${{ vars.PUBLIC_URL_PRODUCTION }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          if [ "${IS_PRODUCTION}" = "true" ]; then
            environment=production
            suffix=PRODUCTION
            project="${PROJECT_PRODUCTION}"
            provider="${PROVIDER_PRODUCTION}"
            deployer="${DEPLOYER_PRODUCTION}"
            public_url="${PUBLIC_URL_PRODUCTION}"
          else
            environment=dev
            suffix=DEV
            project="${PROJECT_DEV}"
            provider="${PROVIDER_DEV}"
            deployer="${DEPLOYER_DEV}"
            public_url="${PUBLIC_URL_DEV}"
          fi
          missing=""
          [ -n "${project}" ]    || missing="${missing} GCP_PROJECT_ID_${suffix}"
          [ -n "${provider}" ]   || missing="${missing} GCP_WIF_PROVIDER_${suffix}"
          [ -n "${deployer}" ]   || missing="${missing} GCP_DEPLOYER_SA_${suffix}"
          [ -n "${public_url}" ] || missing="${missing} PUBLIC_URL_${suffix}"
          [ -n "${REGION}" ]     || missing="${missing} GCP_REGION"
          if [ -n "${missing}" ]; then
            echo "::error::repository variables not set for ${environment}:${missing} — create them under Settings → Secrets and variables → Actions → Variables, from the Terraform outputs listed in infra/README.md"
            exit 1
          fi
          {
            echo "environment=${environment}"
            echo "project=${project}"
            echo "provider=${provider}"
            echo "deployer=${deployer}"
            echo "public_url=${public_url}"
            echo "repository=${REGION}-docker.pkg.dev/${project}/finance-a2ui-${environment}/backend"
            echo "service=finance-a2ui-${environment}-api"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: "Image · build and push it to Artifact Registry by digest"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci, settings]
    permissions:
      contents: read
      id-token: write # mint the federated token; nothing else is granted
    outputs:
      image: ${{ steps.pin.outputs.image }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Check out the commit being released (actions/checkout)
        uses: actions/checkout@v4

      - name: Derive the release identifier from the version and the commit (bash)
        id: release
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' backend/pyproject.toml | cut -d'"' -f2)"
          echo "release=${version}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud without a key (google-github-actions/auth)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.settings.outputs.provider }}
          service_account: ${{ needs.settings.outputs.deployer }}

      - name: Install the gcloud CLI (google-github-actions/setup-gcloud)
        uses: google-github-actions/setup-gcloud@v2

      - name: Allow Docker to push to Artifact Registry (gcloud auth configure-docker)
        run: gcloud auth configure-docker "${{ needs.settings.outputs.region }}-docker.pkg.dev" --quiet

      - name: Set up BuildKit (docker/setup-buildx-action)
        uses: docker/setup-buildx-action@v3

      - name: Build and push the runtime image (docker/build-push-action)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          provenance: true
          tags: |
            ${{ needs.settings.outputs.repository }}:${{ github.sha }}
            ${{ needs.settings.outputs.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin the deployable to its immutable digest (bash)
        id: pin
        run: |
          set -euo pipefail
          echo "image=${{ needs.settings.outputs.repository }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: "Deploy · release the digest and verify it before traffic"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci, settings, publish]
    permissions:
      contents: write # create the release tag after a production deploy
      id-token: write
    # The Environment carries the required reviewer for production and the
    # deployment history for both. This one line is AC-2.
    environment:
      name: ${{ needs.settings.outputs.environment }}
    steps:
      - name: Check out the deploy scripts (actions/checkout)
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud without a key (google-github-actions/auth)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.settings.outputs.provider }}
          service_account: ${{ needs.settings.outputs.deployer }}

      - name: Install the gcloud CLI (google-github-actions/setup-gcloud)
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy without traffic, verify readiness, then shift (deploy_cloud_run.sh)
        env:
          SERVICE: ${{ needs.settings.outputs.service }}
          REGION: ${{ needs.settings.outputs.region }}
          PROJECT: ${{ needs.settings.outputs.project }}
          PUBLIC_URL: ${{ needs.settings.outputs.public_url }}
          IMAGE: ${{ needs.publish.outputs.image }}
          RELEASE: ${{ needs.publish.outputs.release }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: ./infra/scripts/deploy_cloud_run.sh

      - name: Tag the released commit so a tag can only exist for a live deploy (gh)
        if: needs.settings.outputs.environment == 'production' && inputs.rollback_to == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.publish.outputs.release }}
        run: |
          set -euo pipefail
          out="$(mktemp)"
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
               -f ref="refs/tags/v${RELEASE}" -f sha="${GITHUB_SHA}" > "${out}" 2>&1; then
            echo "tagged v${RELEASE}"
          elif grep -q "already exists" "${out}"; then
            echo "tag v${RELEASE} already exists; leaving it alone"
          else
            cat "${out}" >&2
            echo "::error::could not create tag v${RELEASE}"
            exit 1
          fi

  report:
    name: "Report · what was released and where"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci, settings, publish, deploy]
    if: always()
    steps:
      - name: Write the release record to the run summary (GITHUB_STEP_SUMMARY)
        run: |
          {
            echo "## Backend delivery"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Environment | ${{ needs.settings.outputs.environment }} |"
            echo "| Ship gate | ${{ needs.ci.result }} |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Release | \`${{ needs.publish.outputs.release }}\` |"
            echo "| Image | \`${{ needs.publish.outputs.image }}\` |"
            echo "| Publish | ${{ needs.publish.result }} |"
            echo "| Deploy | ${{ needs.deploy.result }} |"
            echo ""
            echo "The deploy job appends the revision name and the readiness result above."
            echo "Rollback: re-run this workflow with \`rollback_to\` set to the last good revision."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run unless every job succeeded (bash)
        # `skipped` counts as a failure here: a rejected production approval
        # leaves `deploy` skipped, and a run that released nothing must not be
        # reported as green.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::delivery did not complete — gate=${{ needs.ci.result }} publish=${{ needs.publish.result }} deploy=${{ needs.deploy.result }}"
          exit 1
