# Backend ship gate. The steps are the same commands as `make gate` in backend/
# and `.claude/ship-gate.json` — if you change one, change all three.
name: backend-ci

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yaml", "docker-compose.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yaml", "docker-compose.yml"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (ruff · pyright · budget · pytest 100 %)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --all-groups --frozen
      - name: py.lint
        run: uv run ruff check .
      - name: py.format
        run: uv run ruff format --check .
      - name: py.types
        run: uv run basedpyright
      - name: py.budget
        run: uv run python scripts/check_file_budget.py
      - name: py.test
        run: uv run pytest --cov --cov-branch --cov-report=term-missing --cov-report=xml
      - name: py.audit
        run: make audit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: finance-a2ui-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id finance-a2ui-backend:ci -u)
          test "$uid" = "10001" || (echo "expected uid 10001, got $uid" && exit 1)
      - name: Image CVE scan (Trivy — OS packages + Python deps)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: finance-a2ui-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

