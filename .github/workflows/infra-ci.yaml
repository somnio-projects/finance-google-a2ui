# Infrastructure-as-code gate (docs/compliance/VULNERABILITY_MANAGEMENT.md §1,
# policy-as-code row) plus the delivery scripts' own tests.
#
# Naming contract (.claude/rules/ci-conventions.md):
#   job name  = "<Area> · <what it proves>"
#   step name = "<Verb> <object> (<tool>)"
name: infra-ci

# The delivery-scripts job asserts properties that span infra/, the two backend
# workflows (what dev is, and that a release waits for a green gate), the
# harness rules index and the declared rate limit, so a change to any of those
# sides has to start this run.
# CLAUDE.md and .claude/rules/** are named for the same reason backend-ci names
# docs/catalog/**: the rules index is rewritten by a tool outside this
# repository, so the edit that drops a row must start the run that rejects it.
# The three backend paths below are named for the rate limit: the documented
# limit, the configured default and the sample environment are compared against
# the Terraform instance ceiling, so the edit that breaks the pair must start
# the run that rejects it (GGU-83).
# (Actions does not expand YAML anchors, so the two lists are spelled out.)
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yaml"
      - ".github/workflows/backend-cd.yaml"
      - ".github/workflows/backend-ci.yaml"
      - "CLAUDE.md"
      - ".claude/rules/**"
      - "backend/docs/SECURITY.md"
      - "backend/src/app/core/config.py"
      - "backend/env.example"
      - "docs/diagrams/08-infrastructure.md"
  push:
    branches: [main, develop]
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yaml"
      - ".github/workflows/backend-cd.yaml"
      - ".github/workflows/backend-ci.yaml"
      - "CLAUDE.md"
      - ".claude/rules/**"
      - "backend/docs/SECURITY.md"
      - "backend/src/app/core/config.py"
      - "backend/env.example"
      - "docs/diagrams/08-infrastructure.md"

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: "Infrastructure · the Terraform is valid and free of misconfigurations"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out the branch (actions/checkout)
        uses: actions/checkout@v7

      - name: Install Terraform (hashicorp/setup-terraform)
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Verify the configuration is canonically formatted (terraform fmt)
        run: terraform fmt -check -recursive

      - name: Initialise the providers without a remote state (terraform init)
        run: terraform init -backend=false -input=false

      - name: Validate the configuration (terraform validate)
        run: terraform validate -no-color

      - name: Scan for insecure infrastructure (trivy config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  delivery-scripts:
    name: "Delivery · the deploy script rolls back and the pipeline holds no keys"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the branch (actions/checkout)
        uses: actions/checkout@v7

      # Shell linting moved to `repo-ci.yaml`, which has no `paths:` filter and
      # lints every tracked script rather than two globs under `infra/scripts/`.
      # The two globs missed both container entry points, and both were red the
      # first time a gate opened them. This job keeps the behavioural tests; the
      # lint that used to sit here is `repo.shell-lint` and is a superset of it.
      # See ci-conventions §5.
      - name: Prove the deploy verifies and rolls back (test_deploy_cloud_run.sh)
        run: bash infra/scripts/tests/test_deploy_cloud_run.sh

      - name: Prove no long-lived key exists and the provider is repository-pinned (test_wif_conditions.sh)
        run: bash infra/scripts/tests/test_wif_conditions.sh

      - name: Prove dev stays cheap by derivation and releases only behind a green gate (test_dev_environment.sh)
        run: bash infra/scripts/tests/test_dev_environment.sh

      - name: Prove every rule file is listed and every row exists (test_rules_index.sh)
        run: bash infra/scripts/tests/test_rules_index.sh

      - name: Prove the documented rate limit is the one the instance count can deliver (test_rate_limit_ceiling.sh)
        run: bash infra/scripts/tests/test_rate_limit_ceiling.sh

  report:
    name: "Report · infrastructure gate summary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [terraform, delivery-scripts]
    if: always()
    steps:
      - name: Write the gate result to the run summary (GITHUB_STEP_SUMMARY)
        run: |
          {
            echo "## Infrastructure gate"
            echo ""
            echo "| Gate | Proves | Result |"
            echo "|---|---|---|"
            echo "| Terraform | formatting, validity, no CRITICAL/HIGH misconfiguration | ${{ needs.terraform.result }} |"
            echo "| Delivery | deploy verifies before traffic and rolls back; no service-account key; provider pinned to this repository; dev cheap by derivation and released only behind a green gate; every rule file carries a row in the CLAUDE.md index and every row a file; the documented per-principal rate limit matches the configured default and the instance count it depends on | ${{ needs.delivery-scripts.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run when any gate failed (bash)
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
