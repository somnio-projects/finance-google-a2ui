# Infrastructure as code gate (docs/compliance/VULNERABILITY_MANAGEMENT.md §1,
# policy-as-code row). Validates and scans infra/ on every change.
name: infra-ci

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra-ci.yaml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra-ci.yaml"]

permissions:
  contents: read

jobs:
  terraform:
    name: terraform fmt · validate · trivy config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: fmt
        run: terraform fmt -check -recursive
      - name: init (no backend)
        run: terraform init -backend=false -input=false
      - name: validate
        run: terraform validate -no-color
      - name: Misconfiguration scan (Trivy — tfsec/checkov rule sets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infra
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
