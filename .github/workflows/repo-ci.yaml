# Repository-wide checks — the ones that belong to no single stack.
#
# This workflow exists because the others are scoped, correctly, by `paths:`:
# `backend-ci` to `backend/**`, `frontend-ci` to `frontend/**`, `infra-ci` to
# `infra/**`. A repository-wide check placed in any of them would run only when
# that directory changed, which is precisely when it is least needed. This
# repository is documentation-heavy — ADRs, specs, diagrams, a compliance
# corpus, a generated catalog contract, `.claude/rules/**` — and a large share
# of its pull requests touch only those. So this workflow carries **no `paths:`
# filter**: it runs on every pull request.
#
# ---------------------------------------------------------------------------
# Why secret scanning and shell linting live HERE and not per stack
# ---------------------------------------------------------------------------
# Both were per-stack, and both were therefore false where it mattered.
#
# gitleaks ran in `backend-ci`, whose `paths:` filter is `backend/**`. Root
# SECURITY.md said "on every PR" and VULNERABILITY_MANAGEMENT.md marked the
# Secrets row "Blocking: yes / every commit / PR / week". A pull request
# touching only `frontend/**` or only `client_flutter/**` started none of it —
# which is the shape of nearly every pull request this repository opened on
# 2026-09-20. Measured: a GitHub-PAT-shaped literal planted in
# `client_flutter/app/lib/` and in `frontend/app/lib/` is found by this job
# (exit 1, 2 findings) and was found by nothing on a client-only PR before it.
#
# shellcheck ran in `infra-ci` over two globs under `infra/scripts/`. The two
# entry-point scripts this repository actually ships were outside it, and both
# were red the first time a gate opened them — including
# `client_flutter/docker/entrypoint.sh`, which substitutes a validated origin
# into the CSP `connect-src` directive.
#
# `client_flutter/` was retired on 2026-09-22 (spec `repo/0002`) and the
# measurements above name files this repository no longer ships. They are kept
# verbatim because they are the *evidence* for this workflow's scope, not a
# description of the tree: the next scoped-check argument should have to answer
# them. `frontend/**` is now the only client directory, and a `frontend/`-only
# pull request is exactly the shape that used to start nothing.
#
# The general rule, now in ci-conventions §5: a check whose subject is "any
# file in this repository" cannot be correct in a scoped workflow. Per-stack
# copies are worse than one repository-wide job — they multiply the command
# strings that §5 has already watched drift twice.
#
# `workflow_call` is here so `backend-cd` can `needs:` these jobs. Secret
# scanning was part of the delivery gate when it lived in `backend-ci`; moving
# it must not quietly remove it from the path to production.
#
# Naming contract (.claude/rules/ci-conventions.md §2):
#   job name  = "<Area> · <what it proves>"
#   step name = "<Verb> <object> (<tool>)"
#
# Every `run:` below is byte-identical to its `repo.*` entry in
# .claude/ship-gate.json and to the matching pre-commit hook. Change one,
# change its pair — §5.
name: repo-ci

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: repo-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.19"
  PYTHON_VERSION: "3.14"

jobs:
  spelling:
    name: "Repository · prose and identifiers are spelled as intended"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Check out the repository (actions/checkout)"
        uses: actions/checkout@v7

      - name: "Install the Python toolchain (astral-sh/setup-uv)"
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: "Spell-check every tracked file, dot-directories included (codespell)"
        run: bash scripts/check_spelling.sh

  secrets:
    name: "Repository · no credential reaches any branch, in any stack"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, not the diff: a credential that was committed and then
      # removed in a later commit is still in the pack file and still leaked.
      - name: "Check out the full history (actions/checkout)"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The pinned image, not the Action wrapper — the wrapper needs an
      # organisation licence and the scanner does not
      # (docs/compliance/VULNERABILITY_MANAGEMENT.md).
      - name: "Scan every commit in every directory for secrets (gitleaks)"
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.24.3 git --config=/repo/.gitleaks.toml --redact --no-banner --exit-code 1

  shell:
    name: "Repository · every shell script the repository ships is linted"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Check out the repository (actions/checkout)"
        uses: actions/checkout@v7

      - name: "Lint every tracked shell script (shellcheck)"
        run: bash scripts/check_shell.sh

  gate-pairs:
    name: "Repository · the ship gate and the workflows run the same commands"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Check out the repository (actions/checkout)"
        uses: actions/checkout@v7

      - name: "Compare every gate command with its workflow step (check_gate_pairs.sh)"
        run: bash scripts/check_gate_pairs.sh

  # One job, two steps, in this order: the suite proves the check rejects, then
  # the check is pointed at the real corpus. Two steps rather than two jobs
  # because both need only a shallow checkout and nothing else — a second runner
  # would pay for a second checkout to run a one-second script (§3).
  spec-numbers:
    name: "Repository · every spec is numbered once and indexed once"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Check out the repository (actions/checkout)"
        uses: actions/checkout@v7

      - name: "Prove the spec-number check rejects a collision (test_check_spec_numbers.sh)"
        run: bash scripts/tests/test_check_spec_numbers.sh

      - name: "Check every spec's number, shape and index row (check_spec_numbers.sh)"
        run: bash scripts/check_spec_numbers.sh

  manual-run:
    name: "Repository · a manual run names the build that served it"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: the suite's fixtures are `HEAD` and `HEAD~2`, and a
      # shallow checkout has neither a stale build to reject nor a foreign one.
      - name: "Check out the full history (actions/checkout)"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Prove the manual-run check rejects a stale or foreign build (test_check_manual_run.sh)"
        run: bash scripts/tests/test_check_manual_run.sh

  # The job above proves the check works. THIS one points it at the real thing.
  # Without it, enforcement on an actual pull request would rest entirely on a
  # reviewer agent remembering to run a command — which is the defect GGU-93
  # describes, reproduced one level up (ci-conventions §5).
  #
  # Not in `ship-gate.json`, deliberately: a laptop has no PR body, so there is
  # no local command for `repo.gate-pairs` to pair this with. It is a
  # workflow-only job, like backend-ci's `image` and frontend-ci's `build`.
  manual-run-body:
    name: "Repository · this pull request's manual run names this branch's head"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      # Full history, and the check is pointed at `head.sha` rather than HEAD:
      # a pull-request checkout's HEAD is the ephemeral merge commit, which is
      # not what the manual run was served by.
      - name: "Check out the full history (actions/checkout)"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Check the manual run against the branch head (check_manual_run.sh)"
        env:
          # Through the environment, never interpolated into the script: a PR
          # body is untrusted text and `${{ }}` would paste it into the shell.
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          set +e
          out=$(bash scripts/check_manual_run.sh "$RUNNER_TEMP/pr-body.md" "$HEAD_SHA" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$out"
          {
            echo "### Manual run"
            echo ""
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 3 ]; then
            # No build identity at all. `.claude/rules/backend/sdd.md` lets a PR
            # declare that a manual run was not possible, with the reason and
            # the consequence — a judgement for a reviewer, not for a grep. So
            # this is reported and not failed, and the reviewer agents still
            # check the `Verification` block.
            echo "::warning::This pull request's body names no build identity. If a manual run was not possible, the Verification block must say so, with the reason and the consequence."
            exit 0
          fi
          exit "$status"

  report:
    name: "Report · repository gate summary"
    runs-on: ubuntu-latest
    needs:
      [spelling, secrets, shell, gate-pairs, spec-numbers, manual-run, manual-run-body]
    if: always()
    timeout-minutes: 5
    steps:
      - name: "Write the gate outcome to the run summary (GitHub Actions)"
        run: |
          {
            echo "### Repository gate"
            echo
            echo "| Check | What it proves | Result |"
            echo "|---|---|---|"
            echo "| Spelling | prose and identifiers are spelled as intended, repository-wide | ${{ needs.spelling.result }} |"
            echo "| Secrets | no credential in any commit, in any stack — including a client-only pull request | ${{ needs.secrets.result }} |"
            echo "| Shell | every tracked shell script passes shellcheck, entry points included | ${{ needs.shell.result }} |"
            echo "| Gate pairs | every ship-gate command appears verbatim in the workflow that runs it | ${{ needs.gate-pairs.result }} |"
            echo "| Spec numbers | no two specs share a number, every spec has one index row, and the check is shown to reject | ${{ needs.spec-numbers.result }} |"
            echo "| Manual run | the manual-run check rejects a build that is stale, foreign, unknown or unnamed | ${{ needs.manual-run.result }} |"
            echo "| Manual run · this PR | the pasted manual run names this branch's head | ${{ needs.manual-run-body.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Fail the run when any gate failed (bash)"
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
