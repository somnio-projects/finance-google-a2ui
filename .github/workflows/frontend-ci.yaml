# Frontend ship gate.
#
# Naming contract (.claude/rules/ci-conventions.md):
#   job name  = "<Area> · <what it proves>"
#   step name = "<Verb> <object> (<tool>)"
# Cost contract: anything a laptop can prove runs in pre-commit, not here.
# CI re-proves it on a clean machine and adds what a laptop cannot: a from-
# scratch dependency resolution against the committed lock, and a release web
# build.
#
# Every `run:` in the `quality` and `tests` jobs is the command string from
# .claude/ship-gate.json and from `frontend/Makefile`, copied rather than
# paraphrased (ci-conventions §5). The `build` job is deliberately beyond
# the gate — slow, and a runner's job, exactly like backend-ci's `image`.
#
# The SDK version is NOT written here. It lives in `frontend/.fvmrc`, which
# every job below reads and which `frontend/tool/check_toolchain.sh` reads on a
# laptop (GGU-94). It used to ALSO be a `FLUTTER_VERSION` env var in this file,
# where no local command could reach it — so the pin existed and the gate a
# developer actually ran was free to disagree with it. `scripts/check_gate_pairs.sh`
# now fails if `FLUTTER_VERSION` reappears in any workflow, or if a second
# tracked file starts naming a Flutter version. Pinned, not floating: `stable`
# would silently change the toolchain under a committed lockfile, the exact
# class of surprise `--enforce-lockfile` exists to prevent.
name: frontend-ci

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yaml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: "Frontend · style, analysis, file budget, generated manifest"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the branch (actions/checkout)
        uses: actions/checkout@v7

      - name: Read the pinned SDK version (.fvmrc)
        id: pin
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up the pinned Flutter SDK (subosito/flutter-action)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      - name: Prove the SDK on PATH is the pinned one (check_toolchain.sh)
        run: bash tool/check_toolchain.sh

      # Runs against a STUBBED SDK, so it exercises the rejection paths the
      # runner can never reach — the runner always has the pinned SDK.
      - name: Prove the preflight rejects a wrong or missing SDK (test_check_toolchain.sh)
        run: bash tool/tests/test_check_toolchain.sh

      - name: Install exactly the locked dependencies (flutter pub get --enforce-lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting is canonical (dart format)
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse with infos and warnings fatal (dart analyze)
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Enforce the 150-line file budget (check_file_budget.dart)
        run: dart run tool/check_file_budget.dart

      - name: Verify the generated component manifest is current (generate_component_manifest.dart)
        run: dart run tool/generate_component_manifest.dart --check

  tests:
    name: "Frontend · unit and widget tests at 100% line coverage per file"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the branch (actions/checkout)
        uses: actions/checkout@v7

      - name: Read the pinned SDK version (.fvmrc)
        id: pin
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up the pinned Flutter SDK (subosito/flutter-action)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      - name: Prove the SDK on PATH is the pinned one (check_toolchain.sh)
        run: bash tool/check_toolchain.sh

      - name: Install exactly the locked dependencies (flutter pub get --enforce-lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Run every package and widget suite (make test)
        run: make test

      - name: Enforce the per-file coverage threshold (make coverage)
        run: make coverage

      - name: Publish the coverage reports (actions/upload-artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: |
            frontend/app/coverage/lcov.info
            frontend/packages/*/coverage/lcov.info
          retention-days: 14

  build:
    name: "Frontend · the web bundle compiles"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only after the cheap jobs pass — a branch that fails analysis never pays
    # for a release build.
    needs: [quality, tests]
    steps:
      - name: Check out the branch (actions/checkout)
        uses: actions/checkout@v7

      - name: Read the pinned SDK version (.fvmrc)
        id: pin
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up the pinned Flutter SDK (subosito/flutter-action)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      # The `build` job is outside the gate, but it gets the preflight too: it
      # is the one job that could otherwise compile under a different SDK than
      # the two that proved the branch, and nobody would see it.
      - name: Prove the SDK on PATH is the pinned one (check_toolchain.sh)
        run: bash tool/check_toolchain.sh

      - name: Install exactly the locked dependencies (flutter pub get --enforce-lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Compile the release web bundle (flutter build web)
        working-directory: frontend/app
        run: flutter build web --release

  report:
    name: "Report · frontend ship-gate summary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, tests, build]
    if: always()
    steps:
      - name: Write the gate result to the run summary (GITHUB_STEP_SUMMARY)
        working-directory: .
        run: |
          {
            echo "## Frontend ship gate"
            echo ""
            echo "| Gate | Proves | Result |"
            echo "|---|---|---|"
            echo "| Quality | dart format, analyzer with infos fatal, 150-line budget, generated component manifest | ${{ needs.quality.result }} |"
            echo "| Tests | three pure-Dart suites + the widget suite, 100 % line coverage per file | ${{ needs.tests.result }} |"
            echo "| Build | the release web bundle compiles | ${{ needs.build.result }} |"
            echo ""
            echo "Local equivalent: \`cd frontend && make gate\`; pre-commit runs the cheap steps before every commit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run when any gate failed (bash)
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        working-directory: .
        run: exit 1
