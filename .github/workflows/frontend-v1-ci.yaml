# Frontend v1 ship gate — the A2UI v1.0 client, `frontend_v1/` (ADR-M D-9).
#
# A copy of frontend-ci.yaml with `frontend` read as `frontend_v1`, plus the
# catalog-copy check. Two deployables get two gates (ci-conventions §4b): a
# change to `frontend/` never starts this one, and the reverse. Every `run:`
# in `quality` and `tests` is a command string from .claude/ship-gate.json's
# `frontend_v1.*` part and from `frontend_v1/Makefile` (ci-conventions §5).
# The SDK pin is `frontend_v1/.fvmrc`, read below and by check_toolchain.sh.
name: frontend-v1-ci

on:
  pull_request:
    paths:
      - "frontend_v1/**"
      # The wire contract both sides bind, and the generated catalog the
      # renderer enforces (docs/a2ui/v1.0/finance.catalog.json → app/assets,
      # `catalog-check`). A stack workflow lists every file its gate READS,
      # not every file its stack owns (ci-conventions §5, GGU-140).
      - "docs/a2ui/**"
      # The frozen view catalog, read by the copied component suites.
      - "docs/catalog/**"
      - ".github/workflows/frontend-v1-ci.yaml"
  # Callable for the same reason frontend-ci is: a delivery workflow can
  # `needs:` it, so nothing ships without a green gate on that commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: frontend-v1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend_v1

jobs:
  quality:
    name: "Frontend v1 · style, analysis, file budget, generated manifest"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the branch (actions/checkout)
        uses: actions/checkout@v7

      - name: Read the pinned SDK version (.fvmrc)
        id: pin
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up the pinned Flutter SDK (subosito/flutter-action)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      - name: Prove the SDK on PATH is the pinned one (check_toolchain.sh)
        run: bash tool/check_toolchain.sh

      # Runs against a STUBBED SDK, so it exercises the rejection paths the
      # runner can never reach — the runner always has the pinned SDK.
      - name: Prove the preflight rejects a wrong or missing SDK (test_check_toolchain.sh)
        run: bash tool/tests/test_check_toolchain.sh

      # Also a rejection-path suite that a runner cannot exercise any other
      # way: `verify_release.sh` is what frontend-cd runs against a deployed
      # origin, and there it can only ever be seen accepting.
      - name: Prove the delivery check rejects a stale release (test_verify_release.sh)
        run: bash tool/tests/test_verify_release.sh

      - name: Install exactly the locked dependencies (flutter pub get --enforce-lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting is canonical (dart format)
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse with infos and warnings fatal (dart analyze)
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Enforce the 150-line file budget (check_file_budget.dart)
        run: dart run tool/check_file_budget.dart

      - name: Verify the generated component manifest is current (generate_component_manifest.dart)
        run: dart run tool/generate_component_manifest.dart --check

      - name: Verify the bundled A2UI catalog is the generated one (sync_catalog.sh)
        run: bash tool/sync_catalog.sh --check

      # The policy the DEPLOYED client is served under. No local run and no
      # widget test sees a CSP, so the one inline script Firebase's web SDK
      # loader needs was blocked in production only — a white page whose only
      # symptom was a console line.
      - name: Prove both CSPs authorise the Firebase SDK loader (check_csp_hashes.sh)
        run: bash tool/check_csp_hashes.sh

  tests:
    name: "Frontend v1 · unit and widget tests at 100% line coverage per file"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the branch (actions/checkout)
        uses: actions/checkout@v7

      - name: Read the pinned SDK version (.fvmrc)
        id: pin
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up the pinned Flutter SDK (subosito/flutter-action)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      - name: Prove the SDK on PATH is the pinned one (check_toolchain.sh)
        run: bash tool/check_toolchain.sh

      - name: Install exactly the locked dependencies (flutter pub get --enforce-lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Run every package and widget suite (make test)
        run: make test

      - name: Enforce the per-file coverage threshold (make coverage)
        run: make coverage

      - name: Publish the coverage reports (actions/upload-artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-v1-coverage
          path: |
            frontend_v1/app/coverage/lcov.info
            frontend_v1/packages/*/coverage/lcov.info
          retention-days: 14

  build:
    name: "Frontend v1 · the web bundle compiles"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only after the cheap jobs pass — a branch that fails analysis never pays
    # for a release build.
    needs: [quality, tests]
    steps:
      - name: Check out the branch (actions/checkout)
        uses: actions/checkout@v7

      - name: Read the pinned SDK version (.fvmrc)
        id: pin
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up the pinned Flutter SDK (subosito/flutter-action)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      # The `build` job is outside the gate, but it gets the preflight too: it
      # is the one job that could otherwise compile under a different SDK than
      # the two that proved the branch, and nobody would see it.
      - name: Prove the SDK on PATH is the pinned one (check_toolchain.sh)
        run: bash tool/check_toolchain.sh

      - name: Install exactly the locked dependencies (flutter pub get --enforce-lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Compile the release web bundle (flutter build web)
        working-directory: frontend_v1/app
        run: flutter build web --release

  report:
    name: "Report · frontend_v1 ship-gate summary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, tests, build]
    if: always()
    steps:
      - name: Write the gate result to the run summary (GITHUB_STEP_SUMMARY)
        working-directory: .
        run: |
          {
            echo "## Frontend v1 ship gate"
            echo ""
            echo "| Gate | Proves | Result |"
            echo "|---|---|---|"
            echo "| Quality | toolchain preflight and its suite, the delivery check's suite, dart format, analyzer with infos fatal, 150-line budget, generated component manifest, catalog copy | ${{ needs.quality.result }} |"
            echo "| Tests | the pure-Dart suites (a2ui_v1 included) + the widget suite, 100 % line coverage per file | ${{ needs.tests.result }} |"
            echo "| Build | the release web bundle compiles | ${{ needs.build.result }} |"
            echo ""
            echo "Local equivalent: \`cd frontend_v1 && make gate\`; pre-commit runs the cheap steps before every commit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run when any gate failed (bash)
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        working-directory: .
        run: exit 1
