# The A2UI v1.0 client (frontend_v1/, ADR-M D-9) on :3002, beside the v0.9
# one on :3001 — an OVERRIDE of the root compose file, which stays untouched:
#
#   APP_RELEASE="local+$(git rev-parse --short HEAD)" \
#     docker compose -f docker-compose.yml -f frontend_v1/docker-compose.yml up --build
#
# Run from the repository root: relative paths resolve against the first
# file's directory, so the build context below is ./frontend_v1. It is the
# same backend and the same Postgres — only the UI's wire differs — so this
# file adds one service and widens the backend's CORS allow-list by the one
# origin the new client is served from. Hardening is the root client's,
# verbatim (nginx-unprivileged, read-only root, no-new-privileges).
services:
  backend:
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173

  frontend_v1:
    build:
      context: ./frontend_v1
      dockerfile: Dockerfile
      args:
        # The browser's view of the API, compiled into the bundle — see the
        # root file's `frontend` service for why it is not http://backend:8000.
        BACKEND_BASE_URL: http://localhost:8000
        APP_RELEASE: ${APP_RELEASE:-local}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3002:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
