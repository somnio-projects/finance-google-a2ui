name: a2ui_v1
description: >-
  The renderer core for A2UI v1.0 in pure Dart — message models, DataPart
  codec, the surface processor, JSON-Pointer data model, catalog composition
  rules and the renderer-to-agent builders. No Flutter and no A2UI dependency
  (ADR-M D-1).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  equatable: ^3.0.0

dev_dependencies:
  coverage: ^1.15.0
  finance_api_client: ^0.1.0
  test: ^1.27.0
  very_good_analysis: ^11.0.0
