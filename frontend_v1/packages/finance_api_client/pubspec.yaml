name: finance_api_client
description: Data layer — HTTP transport for the finance backend. Speaks JSON and RFC 9457; knows no domain.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  equatable: ^3.0.0
  finance_core: ^0.1.0
  # package:http is the official, minimal client and ships MockClient, so the
  # transport is testable without a socket. See ADR-L D-6 for the alternatives.
  http: ^1.6.0

dev_dependencies:
  coverage: ^1.15.0
  test: ^1.27.0
  very_good_analysis: ^11.0.0
