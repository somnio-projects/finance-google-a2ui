# Local stack for the finance-a2ui showcase.
#   docker compose up --build        -> Postgres + backend (hot reload) on :8000
#   docker compose up db             -> only the database (for `make test`, TEST_DATABASE_URL)
# The Flutter client will be added as a third service once its container build lands.
name: finance-a2ui

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app          # local only — never reuse outside compose
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d finance"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: DEBUG
      PUBLIC_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/finance
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      TRUSTED_HOSTS: "*"
      FEATURE_FLAGS_CACHE_TTL_SECONDS: "15"
      AUTH_PROVIDER: jwt
      AUTH_ISSUER: https://issuer.local
      AUTH_AUDIENCE: finance-a2ui
      AUTH_JWT_SECRET: local-dev-only-secret-change-me-0123456789abcdef
      # SENTRY_DSN: set in your shell to enable telemetry locally
      UVICORN_EXTRA_ARGS: --reload --reload-dir /app/src
    volumes:
      - ./backend/src:/app/src:ro       # hot reload; image keeps its own deps
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  db-data:
