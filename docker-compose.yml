# Local stack for the finance-a2ui showcase (run from the repo root).
#   cp backend/env.example backend/.env   -> once; per-solution env files, never committed
#   docker compose up --build             -> Postgres + backend (:8000, hot reload)
#   docker compose up db                  -> only the database (for `make test`, TEST_DATABASE_URL)
#   docker compose --profile client up --build
#                                         -> the above plus the web client (:3000)
#
# The client sits behind a profile so that `docker compose up --build` is still
# Postgres + backend and nothing else: building the Flutter bundle downloads an
# SDK and takes minutes, and a backend developer should never pay for it.
#
# Env policy: this file only carries the *topology* (hostnames, ports, origins
# the services need to reach each other). Credentials and tunables live in each
# solution's own `.env` (git-ignored) and are loaded through `env_file`.
name: finance-a2ui

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app          # local only — never reuse outside compose
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d finance"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env                # required: `cp backend/env.example backend/.env`
    environment:                      # topology only — overrides the same keys in .env
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/finance
      PUBLIC_BASE_URL: http://localhost:8000
      # `/health` reports this VERBATIM — `core/release.py` composes nothing —
      # and it is the only thing that says which build answered a manual run
      # (GGU-93). It used to be the literal `local`, so the local stack could
      # not name its own commit, and a manual run from a tree six commits
      # behind `develop` was pasted into a pull request and read exactly like a
      # correct one. Bring the stack up as
      #
      #     APP_RELEASE="local+$(git rev-parse --short HEAD)" docker compose up --build
      #
      # and `/health` answers `local+<sha>`. The `local+` prefix is required:
      # a bare sha has no `+`, and `scripts/check_manual_run.sh` reads the part
      # after the `+`, so it would see no identity at all. Forgetting the
      # variable leaves `local`, which that check also rejects — a visible
      # failure rather than a plausible one. Deployed revisions get
      # `<version>+<short sha>`, composed by infra/scripts/deploy_cloud_run.sh
      # (spec backend/0007 AC-5).
      APP_RELEASE: ${APP_RELEASE:-local}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      # The local stack has no Firebase, so the sign-in screen's e-mail path
      # is answered by the preview sign-in (spec 0027 OD-3) and the demo
      # account is provisioned at boot. Both are honoured only under the
      # `jwt` provider this stack runs; Terraform sets neither, so dev and
      # production (oidc) answer 404 for the route.
      AUTH_PREVIEW_SIGN_IN_ENABLED: ${AUTH_PREVIEW_SIGN_IN_ENABLED:-true}
      AUTH_BOOTSTRAP_ADMINS: ${AUTH_BOOTSTRAP_ADMINS:-demo@somnio.dev}
      UVICORN_EXTRA_ARGS: --reload --reload-dir /app/src
    volumes:
      - ./backend/src:/app/src:ro       # hot reload; image keeps its own deps
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5

  client:
    profiles: ["client"]              # opt in: `docker compose --profile client up`
    build:
      context: ./client_flutter
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"                   # 3000 is already in the backend's CORS allow-list above
    env_file:
      - path: ./client_flutter/.env   # optional: the client holds no credentials by design.
        required: false               # Everything it is given reaches the browser, so a secret
                                      # here would be a published secret. The hook exists only so
                                      # a developer can override the values below locally.
    environment:                      # topology only
      # The *browser's* view of the API, not the compose network's: this value
      # is served to the page, and `http://backend:8000` does not resolve there.
      BACKEND_BASE_URL: http://localhost:8000
      PORT: 8080
    read_only: true
    tmpfs:
      - /tmp                          # the entrypoint renders nginx.conf and /config.json here
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5


volumes:
  db-data:
