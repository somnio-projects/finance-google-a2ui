# The older Flutter client, on its own, under its own project name.
#
# It used to be a `client` profile in the repository's root docker-compose.yml.
# It was moved out because that file is the ONE local stack for the app this
# repository is about (backend + the A2UI client), and a profile made
# `docker compose up` mean different things depending on which flag you
# remembered. Two deployables with two gates and two pipelines (GGU-91) get
# two stacks; spec `client/0002` AC-6 is restated against this file.
#
#   docker compose -f client_flutter/docker-compose.yml up --build
#
# It appears in `docker ps` and in Docker Desktop under `client-flutter`,
# beside `finance-a2ui` rather than inside it — which is the honest shape: it
# is not part of that stack.
#
# The backend it talks to is NOT started here. This container serves static
# bytes; the BROWSER is what calls the API, so all it needs is that origin —
# and `http://localhost:8000` is the root stack's backend, which is where the
# root `docker compose up` puts it. Start that first, or point this somewhere
# else. The backend already allows :3000 in its local CORS list.
name: client-flutter

services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:8080"                   # 3000 is in the root stack's CORS allow-list
    env_file:
      - path: ./.env                  # optional: the client holds no credentials by design.
        required: false               # Everything it is given reaches the browser, so a secret
                                      # here would be a published secret. The hook exists only so
                                      # a developer can override the values below locally.
    environment:                      # topology only
      # The *browser's* view of the API. `http://backend:8000` would not
      # resolve there, and there is no compose network shared with the root
      # stack anyway.
      BACKEND_BASE_URL: http://localhost:8000
      PORT: 8080
    read_only: true
    tmpfs:
      - /tmp                          # the entrypoint renders nginx.conf and /config.json here
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
