[project]
name = "finance-a2ui-backend"
version = "0.1.0"
description = "FastAPI backend for the Somnio × Google A2UI finance showcase."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.14",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "basedpyright>=1.18",
    "testcontainers[postgres]>=4.8",
    "httpx2>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "UP", "B", "S", "N", "ANN", "RUF"]
ignore = [
    "ANN401", # Any is allowed only where documented (see typing rule 8)
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D", "ANN"]
"alembic/**" = ["D", "ANN", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --------------------------------------------------------------------------- pyright
[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests"]
exclude = [".venv", "alembic"]
reportMissingTypeStubs = false
reportImplicitOverride = false
reportUnusedCallResult = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnnecessaryIsInstance = false
reportUnnecessaryComparison = false
reportMissingSuperCall = false
reportUnusedParameter = false
reportImportCycles = false

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast tests with no I/O (fakes and in-memory doubles only)",
    "integration: tests that exercise the app against a real PostgreSQL",
]
filterwarnings = [
    "error",
    # third-party deprecations (asyncpg/sqlalchemy internals) are not ours to fix here
    "ignore::DeprecationWarning",
    # testcontainers leaves a docker-socket handle open at interpreter exit
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# --------------------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
# Only Protocol method bodies (`...`) and TYPE_CHECKING blocks are excluded.
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]
